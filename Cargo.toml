[workspace]
resolver = "2"
members = [
    "crates/macros",
    "crates/engine_core",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
anyhow = "1.0.100"
egui         = { git = "https://github.com/emilk/egui", branch = "main" }
egui_extras = { git = "https://github.com/emilk/egui", branch = "main", features = ["all_loaders"] }
egui-winit   = { git = "https://github.com/emilk/egui", branch = "main" }
epaint       = { git = "https://github.com/emilk/egui", branch = "main" }
egui-ash-renderer = {git = "https://github.com/RainGameDev/egui-ash-renderer",  features = ["dynamic-rendering"]}
gltf = "1.4.1"
hot-lib-reloader = "0.7"
inventory = "0.3.24"
libloading = "0.8"
nalgebra =  { version = "0.35.0", features = ["serde", "serde-serialize"] }
rand = "0.10.2"
walkdir = "2.5.0"
winit = { version = "0.30.5", features = ["serde"] }
renet = "1.2.0"
renet_netcode = "1"
bincode = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0.151"
gilrs = "0.11.2"
image = { version = "0.25", features = ["jpeg"] }
